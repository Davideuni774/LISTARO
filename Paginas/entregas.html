<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entregas — Listaro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<header class="nav">
  <a class="marca" href="../index.html"><span class="marca-punto"></span> Listaro</a>
  <div class="nav-acciones"></div>
</header>
<main class="app">
  <div class="app-cabecera">
    <div><h1>Entregas</h1><p class="sub">Consulta y actualiza el estado de los repartos.</p></div>
  </div>
  <section class="tarjeta" id="crear-entrega">
    <h2>Nueva entrega</h2>
    <form id="form-entrega" class="form-grid">
      <select id="ent-edificio" name="edificio_id" required></select>
      <select id="ent-repartidor" name="repartidor_id"></select>
      <input name="destinatario" placeholder="Destinatario" required>
      <input name="direccion" placeholder="Dirección">
      <input name="detalle" placeholder="Detalle del pedido">
      <button class="btn btn-naranja" type="submit">Registrar entrega</button>
    </form>
  </section>
  <section id="lista-entregas" class="grilla-edificios"></section>
</main>
<div id="aviso" class="aviso" role="status" aria-live="polite"></div>
<script src="../js/datos.js"></script>
<script src="../js/roles.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
